ROUTES.interests = ({setup})=>{
  $("#nav").classList.add("hide");
  const d = setup ? (App.setupDraft=App.setupDraft||App.profile) : App.profile;
  render(`<div class="page">
    <div class="topbar"><button class="iconbtn" id="bk">${I.back}</button>
      <h2>Your interests</h2><span class="small muted" id="icount">${d.interests.length}</span></div>
    ${setup?`<div class="steps">${Array.from({length:SETUP_STEPS},()=>'<i class="on"></i>').join("")}</div>`:""}
    <div class="scroll pad" id="ibody"></div>
    <div style="padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)">
      <button class="btn" id="iNext">${setup?"Start matching":"Save interests"}</button></div></div>`);
  $("#bk").onclick=()=> setup ? go("setup",{step:3}) : go("app",{tab:"profile"});
  const body=$("#ibody");
  body.innerHTML=`<p class="muted small" style="margin-bottom:16px">Pick at least 5. We use these to work out who you actually have something in common with — 40% overlap unlocks a match.</p>`
    + Object.entries(INTERESTS).map(([cat,items],ci)=>`
      <div style="margin-bottom:22px">
        <h3 style="margin-bottom:11px">${esc(cat)}</h3>
        <div class="chips" data-cat="${ci}">
          ${items.map((it,i)=>{
            const [em,...rest]=it.split(" ");
            return `<button class="chip ${d.interests.includes(it)?"on":""} ${i>=INTEREST_PREVIEW?"more hide":""}"
              data-it="${esc(it)}"><span class="em">${em}</span>${esc(rest.join(" "))}</button>`;
          }).join("")}
          ${items.length>INTEREST_PREVIEW?`<button class="chip showmore" data-c="${ci}" style="border-style:dashed;color:var(--ink-3)">Show more</button>`:""}
        </div></div>`).join("");
  $$(".chip[data-it]",body).forEach(b=>b.onclick=()=>{
    const it=b.dataset.it, i=d.interests.indexOf(it);
    if(i>=0) d.interests.splice(i,1);
    else { if(d.interests.length>=25){ toast("25 interests is plenty"); return; } d.interests.push(it); }
    b.classList.toggle("on"); $("#icount").textContent=d.interests.length;
  });
  $$(".showmore",body).forEach(b=>b.onclick=()=>{
    const wrap=b.parentElement; $$(".more",wrap).forEach(x=>x.classList.remove("hide")); b.remove(); });
  $("#iNext").onclick=async()=>{
    if(d.interests.length<5){ toast("Pick at least 5 interests"); buzz(50); return; }
    d.done=true; await Profiles.save(d);
    App.profile=d; App.setupDraft=null;
    toast(setup?"Profile complete — welcome to ZOOIANS MATCH":"Interests saved");
    go("app",{tab:setup?"people":"profile"});
  };
};
</script>
<script>
/* ==========================================================================
   MAIN APP SHELL
   ========================================================================== */
const TABS=[{k:"people",l:"People",i:I.people},{k:"chats",l:"Chats",i:I.chat},
            {k:"liked",l:"Liked You",i:I.spark},{k:"profile",l:"Profile",i:I.user}];

ROUTES.app = async ({tab})=>{
  App.tab = tab||App.tab||"people";
  const nav=$("#nav"); nav.classList.remove("hide");
  nav.innerHTML=TABS.map(t=>`<button data-t="${t.k}" class="${App.tab===t.k?"on":""}">
    ${t.i}<span>${t.l}</span><span class="badge hide" data-b="${t.k}"></span></button>`).join("");
  $$("#nav button").forEach(b=>b.onclick=()=>go("app",{tab:b.dataset.t}));
  render(`<div class="page"><div class="scroll" id="tabbody" style="display:flex;flex-direction:column"></div></div>`);
  await loadSocial();
  paintBadges();
  const tb=$("#tabbody"); tb.classList.remove("noscroll");
  ({people:viewPeople,chats:viewChats,liked:viewLiked,profile:viewProfile}[App.tab])(tb);
};

function paintBadges(){
  const newLikes=App.likedYou.filter(l=>!App.myLikes.some(m=>m.to===l.from)&&!App.passes.some(x=>x.to===l.from)).length;
  const unread=App.matches.filter(m=>m.lastMsg && m.lastFrom && m.lastFrom!==App.me && (m.lastAt>(readMark(m.id)||0))).length;
  const set=(k,n)=>{ const b=$(`[data-b="${k}"]`); if(!b) return;
    b.classList.toggle("hide",!n); b.textContent=n>9?"9+":n; };
  set("liked",newLikes); set("chats",unread);
}
const readMark=id=>{ try{return +localStorage.getItem("zm:read:"+id)||0}catch(e){return 0} };
const markRead=id=>{ try{localStorage.setItem("zm:read:"+id,String(now()))}catch(e){} };

async function loadSocial(){
  const me=App.me;
  const [matches,likedYou,myLikes,passes,blocks]=await Promise.all([
    Social.matches(me),Social.likedBy(me),Social.myLikes(me),Social.myPasses(me),Promise.resolve([]),loadConfig()
  ]);
  App.matches=matches; App.likedYou=likedYou; App.myLikes=myLikes; App.passes=passes; App.blocks=blocks;
  App.demoOff = !SHOW_SAMPLE_PROFILES;
  await seedIncomingLikes();
}
/* once per member, a few sample members like them so "Liked You" isn't empty */
async function seedIncomingLikes(){
  if(App.demoOff||!SHOW_SAMPLE_PROFILES) return;
  const key="seeded/"+App.me;
  if(await DB.get(key)) return;
  const want = App.profile && App.profile.gender==="Female" ? "Male" : "Female";
  const mine=(App.profile||{}).interests||[];
  const pick=DEMO.filter(p=>p.gender===want).sort((a,b)=>overlapPct(b.interests,mine)-overlapPct(a.interests,mine)).slice(0,3);
  for(const p of pick) await Social.like(p.code,App.me,false);
  await DB.set(key,{at:now()});
  App.likedYou=await Social.likedBy(App.me);
}

async function allProfiles(){
  const real=await Profiles.all();
  const demo=App.demoOff?[]:DEMO;
  const map=new Map();
  demo.forEach(p=>map.set(p.code,p));
  real.forEach(p=>{ if(p&&p.code) map.set(p.code,p); });
  return Array.from(map.values());
}
const profileCache=new Map();
async function profileOf(code){
  if(profileCache.has(code)) return profileCache.get(code);
  const demo=DEMO.find(d=>d.code===code);
  const p=(await Profiles.get(code))||demo||{code,name:"Member",photos:[],interests:[]};
  profileCache.set(code,p); return p;
}

/* ==========================================================================
   PEOPLE — swipe deck
   ========================================================================== */
async function viewPeople(root){
  root.innerHTML=`<div class="topbar">
      ${brandTile(38)}
      <h2 style="display:flex;align-items:center">${brandText(22)}</h2>
      <button class="iconbtn" id="filtBtn" aria-label="Discovery settings">${I.settings}</button></div>
    <div id="deck"></div>
    <div class="deckact">
      <button class="act undo" id="aUndo" aria-label="Undo">${I.undo}</button>
      <button class="act nope" id="aNope" aria-label="Pass">${I.x}</button>
      <button class="act like big" id="aLike" aria-label="Like">${I.heart}</button>
      <button class="act star" id="aStar" aria-label="Super like">${I.star}</button>
    </div>`;
  root.style.paddingBottom="8px"; root.classList.add("noscroll");
  $("#filtBtn").onclick=openFilters;
  await buildDeck();
  $("#aUndo").onclick=undoSwipe;
  $("#aNope").onclick=()=>swipeTop(-1);
  $("#aLike").onclick=()=>swipeTop(1);
  $("#aStar").onclick=()=>swipeTop(1,true);
}

async function buildDeck(){
  const me=App.profile;
  const want = me.gender==="Female" ? "Male" : "Female";
  const seen=new Set([...App.myLikes.map(l=>l.to),...App.passes.map(p=>p.to),App.me]);
  const blocked=new Set(App.blocks.map(b=>b.from===App.me?b.to:b.from));
  const all=await allProfiles();
  let list=all.filter(p=>p && p.done && p.gender===want && !seen.has(p.code) && !blocked.has(p.code));
  /* distance filter: only when both sides have a known position */
  if(me.loc && me.loc.mode!=="global"){
    const r=me.loc.radius||DEFAULT_RADIUS;
    list=list.filter(p=>{ if(p.loc&&p.loc.mode==="global") return true;
      const d=distKm(me,p); return d==null || d<=r; });
  }
  const likers=new Set(App.likedYou.map(l=>l.from));
  list.sort((a,b)=>{
    const la=likers.has(a.code)?1:0, lb=likers.has(b.code)?1:0;
    if(la!==lb) return lb-la;
    return overlapPct(b.interests,me.interests)-overlapPct(a.interests,me.interests);
  });
  App.deck=list.slice(0,30);
  drawDeck();
}

function drawDeck(){
  const d=$("#deck"); if(!d) return;
  if(!App.deck.length){
    d.innerHTML=`<div class="emptydeck"><div style="width:150px">${pandaSVG("f")}</div>
      <h2>That's everyone for now</h2>
      <p class="muted small" style="max-width:260px">New people appear as they join. Widen your radius or check Liked You in the meantime.</p>
      <button class="btn ghost sm" id="resetPasses">Show passed profiles again</button></div>`;
    const r=$("#resetPasses"); if(r) r.onclick=async()=>{
      await Social.clearPasses(App.me);
      App.passes=[]; toast("Passed profiles are back"); await buildDeck();
    };
    return;
  }
  const top=App.deck.slice(0,3).reverse();
  d.innerHTML=top.map((p,i)=>cardHTML(p,i===top.length-1)).join("");
  const cards=$$(".swipecard",d);
  const topCard=cards[cards.length-1];
  cards.forEach((c,i)=>{ const depth=cards.length-1-i;
    c.style.transform=`translateY(${depth*9}px) scale(${1-depth*.035})`;
    c.style.zIndex=10+i; c.style.opacity=depth>1?".7":"1";
    c.style.pointerEvents = depth===0?"auto":"none"; });
  if(topCard) wireCard(topCard,App.deck[0]);
}

function cardHTML(p){
  const me=App.profile;
  const com=commonInterests(p.interests||[],me.interests||[]).slice(0,3);
  const pct=overlapPct(p.interests||[],me.interests||[]);
  const km=distKm(me,p);
  return `<article class="swipecard" data-code="${p.code}">
    <div class="photo" style="background-image:url('${(p.photos&&p.photos[0])||artFor(p.code,p.name)}')"></div>
    <div class="shade"></div>
    ${(p.photos||[]).length>1?`<div class="dots">${p.photos.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>`:""}
    <div class="tapzone l"></div><div class="tapzone r"></div>
    <div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div>
    <div class="info">
      <div class="nm">${esc(p.name)} <i>${p.age||""}</i></div>
      ${p.gc&&p.gc.member&&p.gc.which?`<div style="margin-top:8px"><span class="zoobadge">🐼 ${esc(p.gc.which)} Member</span></div>`:""}
      <div class="metaline">
        ${p.work?`<span>${esc(p.work)}</span>`:""}
        ${p.looking?`<span>${esc(plain(p.looking))}</span>`:""}
        ${p.loc&&p.loc.label?`<span>📍 ${esc(p.loc.label)}${km!=null?` · ${km<2?"nearby":km+" km"}`:""}</span>`:""}
      </div>
      ${com.length?`<div class="common"><b>${pct}% in common</b>${com.map(c=>`<em>${esc(c)}</em>`).join("")}</div>`:""}
      <button class="btn ghost sm" data-open="${p.code}" style="margin-top:12px;color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)">View full profile</button>
    </div></article>`;
}

function wireCard(card,p){
  let sx=0,sy=0,dx=0,dy=0,drag=false,photoIdx=0;
  const like=$(".stamp.like",card), nope=$(".stamp.nope",card);
  const photos=(p.photos&&p.photos.length?p.photos:[artFor(p.code,p.name)]);
  const showPhoto=i=>{ photoIdx=(i+photos.length)%photos.length;
    $(".photo",card).style.backgroundImage=`url('${photos[photoIdx]}')`;
    $$(".dots i",card).forEach((d,j)=>d.classList.toggle("on",j===photoIdx)); };
  const lz=$(".tapzone.l",card), rz=$(".tapzone.r",card);
  if(lz) lz.onclick=e=>{e.stopPropagation();showPhoto(photoIdx-1)};
  if(rz) rz.onclick=e=>{e.stopPropagation();showPhoto(photoIdx+1)};
  const ob=$("[data-open]",card); if(ob) ob.onclick=e=>{e.stopPropagation();openProfileSheet(p)};

  card.addEventListener("pointerdown",e=>{
    if(e.target.closest("[data-open]")||e.target.closest(".tapzone")) return;
    drag=true; sx=e.clientX; sy=e.clientY; card.style.transition="none";
    try{card.setPointerCapture(e.pointerId)}catch(_){}
  });
  card.addEventListener("pointermove",e=>{
    if(!drag) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy*.35}px) rotate(${dx/18}deg)`;
    like.style.opacity=clamp(dx/110,0,1); nope.style.opacity=clamp(-dx/110,0,1);
  });
  const release=()=>{ if(!drag) return; drag=false;
    card.style.transition="transform .3s var(--ease), opacity .3s";
    if(Math.abs(dx)>96) finishSwipe(card,p,dx>0?1:-1,false);
    else { card.style.transform=""; like.style.opacity=0; nope.style.opacity=0; }
    dx=0;dy=0; };
  card.addEventListener("pointerup",release);
  card.addEventListener("pointercancel",release);
}

function swipeTop(dir,superLike){
  const card=$("#deck .swipecard:last-child"); const p=App.deck[0];
  if(!card||!p) return;
  card.style.transition="transform .34s var(--ease), opacity .34s";
  finishSwipe(card,p,dir,superLike);
}
async function finishSwipe(card,p,dir,superLike){
  card.style.transform=`translate(${dir*window.innerWidth}px,-40px) rotate(${dir*22}deg)`;
  card.style.opacity="0";
  App.lastSwipe={code:p.code,dir};
  App.deck.shift();
  setTimeout(drawDeck,200);
  if(dir>0){ await doLike(p,superLike); } else { await Social.pass(App.me,p.code); App.passes.push({to:p.code}); }
  buzz(dir>0?[14]:8);
}
async function undoSwipe(){
  const last=App.lastSwipe;
  if(!last){ toast("Nothing to undo"); return; }
  await Social.unlike(App.me,last.code);
  await Social.unpass(App.me,last.code);
  App.myLikes=App.myLikes.filter(l=>l.to!==last.code);
  App.passes=App.passes.filter(l=>l.to!==last.code);
  App.lastSwipe=null; toast("Brought that one back");
  await buildDeck();
}

async function doLike(p,superLike){
  const {error}=await Social.like(App.me,p.code,superLike);
  if(error){ toast("Couldn't send the like: "+error.message,3800); return; }
  App.myLikes.push({to:p.code});
  /* the database trigger creates the match instantly when both sides liked */
  const m=await Social.findMatch(App.me,p.code);
  if(m){ App.matches=await Social.matches(App.me); showMatch(p); }
  else if(superLike){ toast(`${p.name} will see your super like first`); }
}

/* ------------------------------ filters ---------------------------------- */
function openFilters(){
  const d=App.profile;
  const rad=Math.min(d.loc.radius||DEFAULT_RADIUS,MAX_RADIUS);
  const b=modal("Discovery settings",`
    <div class="field"><label>Showing you</label>
      <div class="card" style="display:flex;gap:10px;align-items:center;background:var(--honey-wash)">
        <span>${d.gender==="Female"?"♂":"♀"}</span><b>${d.gender==="Female"?"Male":"Female"} profiles</b></div>
      <div class="help">Based on your gender. Change it in Profile → Edit.</div></div>
    <div class="field"><label>Radius — <b id="fr">${rad} km</b></label>
      <input type="range" id="frad" min="5" max="${MAX_RADIUS}" step="5" value="${rad}"></div>
    <div class="field"><label>Location</label>

function personMenu(p,after){
  if(p.code===App.me){ toast("That's you"); return; }
  const isMatch=App.matches.some(m=>m.members.includes(p.code));
  const b=modal(p.name,`
    ${isMatch?`<button class="listopt" id="mUnmatch">${I.x}<span>Unmatch ${esc(p.name)}</span></button>`:""}
    <button class="listopt" id="mReport">${I.flag}<span>Report ${esc(p.name)}</span></button>`);
  $("#mReport",b).onclick=()=>{ closeModal(); reportDialog(p); };

      <button class="btn danger" id="okUn">Unmatch</button>

function reportDialog(p){
  if(p.code===App.me){ toast("That's you"); return; }
  const reasons=["Fake profile","Inappropriate photos","Harassment or abuse","Underage","Spam or scam"];
  const b=modal(`Report ${p.name}`,`
    <p class="small muted" style="margin-bottom:12px">Reports go straight to the admin. Your name isn't shown to the person you report.</p>
    ${reasons.map(r=>`<button class="listopt" data-r="${esc(r)}"><span class="tick"></span><span>${esc(r)}</span></button>`).join("")}
    <textarea class="input" id="rnote" placeholder="Anything else the admin should know? (optional)" style="margin-top:14px"></textarea>
    <button class="btn danger" id="rSend" style="margin-top:12px" disabled>Send report</button>`);

  $$("[data-r]",b).forEach(x=>x.onclick=()=>{ chosen=x.dataset.r;
    $$("[data-r]",b).forEach(y=>y.classList.toggle("on",y===x)); $("#rSend",b).disabled=false; });
  $("#rSend",b).onclick=async()=>{ await Social.report(App.me,p.code,chosen,$("#rnote",b).value);
    closeModal(); toast("Report sent to the admin"); };
}

    const lb=row.querySelector("[data-like]");

    const cb=row.querySelector("[data-chat]");
    if(cb) cb.onclick=()=>openChat(pairId(App.me,p.code),p);
    list.appendChild(row);
  }
}

async function viewChats(root){
  root.innerHTML=`<div class="topbar"><h2>Chats</h2></div>
    <div class="searchwrap"><div class="search">${I.search}
      <input id="chatSearch" placeholder="Search your matches" autocomplete="off"></div></div>

  const blocked=new Set(App.blocks.map(b=>b.from===App.me?b.to:b.from));
  const rows=[];
  for(const m of App.matches){
    const other=m.members.find(c=>c!==App.me);
    if(blocked.has(other)) continue;
    rows.push({m,p:await profileOf(other)});
  }
  rows.sort((a,b)=>(b.m.lastAt||b.m.at)-(a.m.lastAt||a.m.at));

  if(!rows.length){
    $("#threadList").innerHTML=`<div style="text-align:center;padding:44px 34px">
      <div style="width:220px;margin:0 auto;position:relative;height:120px" class="pandas">
        <span class="spark">💛</span><div class="p m">${pandaSVG("m")}</div><div class="p f">${pandaSVG("f")}</div></div>
      <h2 style="margin-top:14px">No matches yet</h2>
      <p class="muted small" style="margin-top:8px">Share at least 40% of your interests with someone and like each other — your inbox opens straight away.</p>

    $("#goSwipe2").onclick=()=>go("app",{tab:"people"});
    return;
  }
  const fresh=rows.filter(r=>!r.m.lastMsg);
  if(fresh.length){
    $("#newMatches").innerHTML=`<div class="newmatches">
      <h3 style="padding:0 18px 4px;font-size:15px">New matches</h3>
      <div class="nmrow">${fresh.map(r=>`<div class="nm-item" data-c="${r.p.code}">
        <img src="${(r.p.photos&&r.p.photos[0])||artFor(r.p.code,r.p.name)}" alt="">
        <span>${esc(r.p.name)}</span></div>`).join("")}</div></div>`;
    $$(".nm-item").forEach(n=>n.onclick=()=>{ const r=rows.find(x=>x.p.code===n.dataset.c); openChat(r.m.id,r.p); });
  }
  const paint=q=>{
    const list=$("#threadList"); list.innerHTML="";
    const filtered=rows.filter(r=>!q||r.p.name.toLowerCase().includes(q.toLowerCase()));
    if(!filtered.length){ list.innerHTML=`<p class="muted small" style="padding:28px;text-align:center">No match by that name.</p>`; return; }
    filtered.forEach(r=>{
      const unread=r.m.lastMsg&&r.m.lastFrom&&r.m.lastFrom!==App.me&&r.m.lastAt>readMark(r.m.id);
      const row=el("button","thread");
      row.innerHTML=`<img class="av sm" src="${(r.p.photos&&r.p.photos[0])||artFor(r.p.code,r.p.name)}" alt="">

      row.onclick=()=>openChat(r.m.id,r.p);

/* ------------------------------ thread ----------------------------------- */
let threadUnsub=null;
async function openChat(pid,other){
  App.openChatPid=pid;
  if(threadUnsub){ try{threadUnsub()}catch(e){} threadUnsub=null; }
  markRead(pid);
  const sheet=el("div","sheet");
  sheet.innerHTML=`
    <div class="topbar line">
      <button class="iconbtn" id="cBack">${I.back}</button>
      <img class="av sm" id="cAv" style="width:38px;height:38px;border-radius:13px" src="${(other.photos&&other.photos[0])||artFor(other.code,other.name)}" alt="">
      <h2 style="flex:1;font-size:17px">${esc(other.name)}</h2>
      <button class="iconbtn" id="cCall">${I.phone}</button>
      <button class="iconbtn" id="cVid">${I.video}</button>
      <button class="iconbtn" id="cMore">⋯</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <textarea id="cText" rows="1" placeholder="Message ${esc(other.name)}"></textarea>
      <button class="roundbtn" id="cSend">${I.send}</button></div>`;
  $("#frame").appendChild(sheet);
  $("#cBack",sheet).onclick=()=>{ if(threadUnsub){try{threadUnsub()}catch(e){}} App.openChatPid=null; sheet.remove(); go("app",{tab:"chats"}); };
  $("#cAv",sheet).onclick=()=>openProfileSheet(other,{readonly:true});
  $("#cMore",sheet).onclick=()=>personMenu(other,()=>sheet.remove());
  $("#cCall",sheet).onclick=()=>startCall(other,"audio");
  $("#cVid",sheet).onclick=()=>startCall(other,"video");

  const box=$("#msgs",sheet);
  const paint=msgs=>{
    box.innerHTML=`<div class="chatintro">
      <div style="width:110px;margin:0 auto">${pandaSVG(other.gender==="Female"?"f":"m")}</div>
      <b style="display:block;color:var(--ink);font-size:15px;margin-top:6px">You matched with ${esc(other.name)}</b>
      ${overlapPct(other.interests||[],App.profile.interests||[])}% of your interests overlap. Start with that.</div>`;
    msgs.forEach(m=>{
      const b=el("div","bub "+(m.from===App.me?"me":"them"));
      b.innerHTML=`${esc(m.text)}<span class="tm">${clockOf(m.at)}</span>`;
      box.appendChild(b);
    });
    box.scrollTop=box.scrollHeight;
  };
  let list=await Chat.thread(pid,App.me,other.code); paint(list);
  const addMsg=m=>{ if(list.some(x=>x.id===m.id)) return; list.push(m); list.sort((a,b)=>a.at-b.at); paint(list); markRead(pid); };
  threadUnsub=Chat.subscribe(pid,addMsg,App.me,other.code);          /* live: new messages appear instantly */
  /* safety net: even if the websocket drops, the chat re-syncs every 3 s */
  const poll=setInterval(async()=>{
    if(!document.body.contains(sheet)){ clearInterval(poll); return; }
    if(document.hidden) return;
    (await Chat.thread(pid,App.me,other.code)).forEach(addMsg);
  },3000);

  const ta=$("#cText",sheet);
  ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,110)+"px"; });
  const send=async()=>{
    const t=ta.value.trim(); if(!t) return;
    ta.value=""; ta.style.height="auto";
    const {data,error}=await Chat.send(pid,App.me,t,other.code);
    if(error){ ta.value=t; toast("Message not sent: "+error.message,3800); return; }
    if(data) addMsg(data);
    markRead(pid);
  };
  $("#cSend",sheet).onclick=send;
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>900){ e.preventDefault(); send(); }});
}

/* ==========================================================================
   BOOT
   ========================================================================== */
async function boot(){
  applyTheme();
  $("#splashMark").src=LOGO; $("#deskMark").src=LOGO;
  $("#splashPandas").insertAdjacentHTML("beforeend",
    `<div class="p m">${pandaSVG("m")}</div><div class="p f">${pandaSVG("f")}</div>`);

  await DB.init();
  await loadConfig();

  /* keep the UI honest if the session ends elsewhere (other tab, expired token) */
  if(sb) sb.auth.onAuthStateChange(ev=>{
    if(ev==="SIGNED_OUT" && App.me && !App.preview){
      clearInterval(startGuard._t); App.me=null; App.profile=null; Session.clear(); go("login");
    }
  });

  const done=()=>{ const s=$("#splash"); if(!s) return; s.classList.add("out"); setTimeout(()=>s.remove(),700); };

  if(location.hash==="#/admin"){ done(); openAdmin(); ROUTES.login(); return; }

  /* restore the signed-in user after a refresh */
  const s=await Auth.session();
  if(s && s.user){
    if(await Members.isActive(codeOf(s.user))){
      const code=codeOf(s.user);
      App.me=code; App.email=s.user.email||""; App.preview=false;
      await Members.touch(code);
      const p=await Profiles.get(code);
      App.profile=p||blankProfile(code);
      setTimeout(done,700);
      if(!p||!p.done){ App.setupDraft=App.profile; go("setup",{step:0}); }
      else go("app",{tab:"people"});
      startGuard(); startRealtime(); return;
    }
    await Auth.signOut();
    setTimeout(done,900); go("login");
    setTimeout(()=>showAlert("err","Your account has been suspended. Contact support if you think this is a mistake."),50);
    return;
  }
  setTimeout(done,900);
  go("login");
}

/* live updates: new messages (unread badge + inbox order), new likes, new matches */
function startRealtime(){
  App.watchers.forEach(u=>{try{u()}catch(e){}}); App.watchers=[];
  const me=App.me; if(!me||App.preview) return;
  const onList=()=>App.screen==="app"&&!$("#frame .sheet");
  let syncing=false;

  /* one place that reconciles matches: new match -> popup, unmatched -> chat disappears, new message -> list order */
  async function syncMatches(){
    if(syncing||!App.me) return; syncing=true;
    try{
      const prev=App.matches||[], after=await Social.matches(me);
      const prevIds=new Set(prev.map(m=>m.id)), nowIds=new Set(after.map(m=>m.id));
      const fresh=after.filter(m=>!prevIds.has(m.id)), gone=prev.filter(m=>!nowIds.has(m.id));
      const msgChanged=after.some(m=>{ const o=prev.find(x=>x.id===m.id); return o&&o.lastAt!==m.lastAt; });
      App.matches=after;
      if(gone.length){ App.myLikes=await Social.myLikes(me); App.likedYou=await Social.likedBy(me); }
      paintBadges();
      if(App.openChatPid && !nowIds.has(App.openChatPid)){      /* the other person unmatched you while this chat was open */
        if(threadUnsub){ try{threadUnsub()}catch(e){} threadUnsub=null; }
        $$("#frame .sheet").forEach(x=>x.remove()); App.openChatPid=null;
        go("app",{tab:"chats"}); return;
      }
      if(fresh.length){ const other=await profileOf(fresh[0].members.find(c=>c!==me)); showMatch(other); }
      if(onList()){
        if(App.tab==="chats" && (fresh.length||gone.length||msgChanged)) go("app",{tab:"chats"});
        else if(App.tab==="liked" && (fresh.length||gone.length)) go("app",{tab:"liked"});
        else if(App.tab==="people" && gone.length) go("app",{tab:"people"});   /* they're back in discovery */
      }
    }finally{ syncing=false; }
  }

  App.watchers.push(Chat.watchInbox(m=>{
    const mt=App.matches.find(x=>x.id===m.pid||(x.alias&&x.alias.includes(m.pid))||(m.from&&m.to&&x.members.includes(m.from)&&x.members.includes(m.to)));
    if(!mt){ syncMatches(); return; }
    mt.lastMsg=m.text; mt.lastAt=m.at; mt.lastFrom=m.from; paintBadges();
    if(m.from!==me) buzz(20);
    if(App.tab==="chats"&&onList()) go("app",{tab:"chats"});
  }));
  App.watchers.push(Social.watch(me,{
    onLike:async()=>{ App.likedYou=await Social.likedBy(me); paintBadges();
      if(App.tab==="liked"&&onList()) go("app",{tab:"liked"}); },
    onMatch:syncMatches, onGone:syncMatches
  }));
  /* safety net: also reconcile every 6 s (covers a dropped websocket) */
  const t=setInterval(()=>{ if(!document.hidden) syncMatches(); },6000);
  App.watchers.push(()=>clearInterval(t));
}

/* a disabled member loses access within a minute, even mid-session */
function startGuard(){
  clearInterval(startGuard._t);
  const check=async()=>{
    if(!App.me || App.preview) return;
    if(!(await Members.isActive(App.me))){
      clearInterval(startGuard._t);
      App.watchers.forEach(u=>{try{u()}catch(e){}}); App.watchers=[];
      closeModal(); $$("#frame .sheet").forEach(x=>x.remove()); $("#matchui").classList.remove("on"); $("#callui").classList.remove("on");
      await Auth.signOut(); Session.clear(); App.me=null; App.profile=null; profileCache.clear();
      go("login");
      setTimeout(()=>showAlert("err","Your account has been banned."),50);
    } else { Members.touch(App.me); }
  };
  startGuard._t=setInterval(check,20000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
}

window.addEventListener("hashchange",()=>{ if(location.hash==="#/admin") openAdmin(); else closeAdmin(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal();
  const s=$("#frame .sheet:last-of-type"); if(s) s.remove(); } });

boot();
</script>
