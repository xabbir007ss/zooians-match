async function runVerify(cv){
  const done=(state,t)=>{ App.verifyState=state; if(t) toast(t,3800); if(App.screen==="app"&&App.tab==="profile") go("app",{tab:"profile"}); };
  try{
    const f=await loadFace();
    const opt=new f.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.3});
    const me=await f.detectSingleFace(cv,opt).withFaceLandmarks().withFaceDescriptor();
    if(!me){ done("failed","We couldn't see your face in the selfie. Please try again."); return; }
    let best=0, found=0;
    for(const src of (App.profile.photos||[]).filter(Boolean)){
      try{ const im=await loadFaceImg(src); const d=await f.detectSingleFace(im,opt).withFaceLandmarks().withFaceDescriptor();
        if(d){ found++; best=Math.max(best,Math.max(0,1-f.euclideanDistance(me.descriptor,d.descriptor))*100); } }catch(_){}
    }
    if(!found){ done("failed","We couldn't find a clear face in your profile photos."); return; }
    if(Math.round(best)>=FACE_MIN_MATCH){
      App.profile.verified=true; await Profiles.save(App.profile);
      done("", "✓ You're verified! Your card now shows Photo verified.");
    } else done("failed","Your selfie didn't match your profile photos. Please try again.");
  }catch(e){ console.warn("[verify]",e); done("failed","Couldn't run the face check. Please try again."); }
}

function swipeTop(dir,superLike){
  const card=$("#deck .swipecard:last-child"); const p=App.deck[0];
  if(!card||!p||swipeState().locked) return;
  card.style.transition="transform .34s var(--ease), opacity .34s";
  finishSwipe(card,p,dir,superLike);
}
async function finishSwipe(card,p,dir,superLike){
  card.style.transform=`translate(${dir*window.innerWidth}px,-40px) rotate(${dir*22}deg)`;
  card.style.opacity="0";
  App.lastSwipe={code:p.code,dir};
  App.deck.shift(); logSwipe(); Quota.bump();
  setTimeout(drawDeck,200);
  if(dir>0){ const r=await doLike(p,superLike); if(r==="limit") App.deck.unshift(p); else await Quota.state(); }
  else { await Social.pass(App.me,p.code); App.passes.push({to:p.code,at:Date.now()}); await Quota.use(); }
  buzz(dir>0?[14]:8);
}
async function undoSwipe(){
  const last=App.lastSwipe;
  if(!last){ toast("Nothing to undo"); return; }
  await Social.unlike(App.me,last.code);
  await Social.unpass(App.me,last.code);
  App.myLikes=App.myLikes.filter(l=>l.to!==last.code);
  App.passes=App.passes.filter(l=>l.to!==last.code);
  unlogSwipe(); await Quota.undo(); App.lastSwipe=null; toast("Brought that one back");
  await buildDeck();
}

async function doLike(p,superLike){
  const {error}=await Social.like(App.me,p.code,superLike);
  if(error){
    if(String(error.message).includes("swipe_limit")){ await Quota.state(); setTimeout(()=>{ if(App.screen==="app"&&App.tab==="people") drawDeck(); },50); return "limit"; }
    toast("Couldn't send the like: "+error.message,3800); return; }
  App.myLikes.push({to:p.code,at:Date.now()});
  /* the database trigger creates the match instantly when both sides liked */
  const m=await Social.findMatch(App.me,p.code);
  if(m){ App.matches=await Social.matches(App.me); showMatch(p); }
  else if(superLike){ toast(`${p.name} will see your super like first`); }
}

  $$("[data-note]",x).forEach(b=>b.onclick=()=>openNote(p));
  /* the open profile only scrolls up/down — horizontal swipe is disabled; pull down from the top to close */
  x.style.touchAction="pan-y";
  let ty=0,atTop=false;
  x.addEventListener("touchstart",e=>{ ty=e.touches[0].clientY; atTop=x.scrollTop<=0; },{passive:true});

/* ---------- face-cropped avatars (profile tab + chats) ---------- */
let _fdP=null;
function loadFD(){
  if(_fdP) return _fdP;
  _fdP=new Promise((res,rej)=>{
    const go=async()=>{ try{ await window.faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS); res(window.faceapi); }catch(e){ rej(e); } };
    if(window.faceapi) return go();
    const sc=document.createElement("script"); sc.src=FACE_JS; sc.onload=go; sc.onerror=()=>rej(new Error("load")); document.head.appendChild(sc);
  }).catch(e=>{ _fdP=null; throw e; });
  return _fdP;
}
const _faceCache=new Map(); let _faceQ=Promise.resolve();
const hashStr=t=>{ let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); };
function faceCrop(url){
  if(!url||/^data:image\/svg/.test(url)) return Promise.resolve(null);
  if(_faceCache.has(url)) return _faceCache.get(url);
  const key="zm:fc:"+hashStr(url);
  try{ const c=localStorage.getItem(key); if(c){ const pr=Promise.resolve(c==="-"?null:c); _faceCache.set(url,pr); return pr; } }catch(e){}
  const job=_faceQ.then(async()=>{
    try{
      const f=await loadFD(); const im=await loadFaceImg(url);
      const d=await f.detectSingleFace(im,new f.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:.35}));
      let out=null;
      if(d){
        const W=im.naturalWidth,H=im.naturalHeight, bx=d.box;
        const side=Math.min(Math.max(bx.width,bx.height)*1.9,W,H);
        const sx=Math.max(0,Math.min(W-side,bx.x+bx.width/2-side/2)), sy=Math.max(0,Math.min(H-side,bx.y+bx.height/2-side/2-bx.height*.06));
        const cv=document.createElement("canvas"); cv.width=cv.height=120;
        cv.getContext("2d").drawImage(im,sx,sy,side,side,0,0,120,120);
        out=cv.toDataURL("image/jpeg",.86);
      }
      try{ localStorage.setItem(key,out||"-"); }catch(e){}
      return out;
    }catch(e){ return null; }
  });
  _faceQ=job.catch(()=>{}); _faceCache.set(url,job); return job;
}
function hydrateFaces(root){
  /* the picture stays invisible until the face crop is ready, so the full photo never flashes first */
  $$("img[data-face]:not([data-fdone])",root||document).forEach(im=>{
    im.dataset.fdone="1"; const u=im.dataset.face; let done=false;
    const fin=c=>{ if(done) return; done=true; if(c&&im.isConnected) im.src=c; im.classList.add("fc"); };
    if(!u){ fin(null); return; }
    faceCrop(u).then(fin,()=>fin(null));
    setTimeout(()=>fin(null),8000);                       /* no face / slow model: fall back to the photo */
  });
}
(function(){ let t=0; const fr=document.getElementById("frame"); if(!fr) return;
  new MutationObserver(()=>{ clearTimeout(t); t=setTimeout(()=>hydrateFaces(fr),16); }).observe(fr,{childList:true,subtree:true}); })();

<div id="chipLine"></div><div id="newMatches"></div><div id="pgNear"></div><div id="threadList"></div>`;  const blocked=new Set(App.blocks.map(b=>b.from===App.me?b.to:b.from));

const PGLoc={
  wid:null, timer:null, pos:null, busy:false, last:0, sent:false, state:"idle", hiddenAt:0, inited:false,
  note(){
    const m={denied:"Location is blocked. Allow location for this site in your browser settings to find people nearby.",
             nofix:"Getting your location…", unsupported:"This device can't share location.",
             setup:"PandaGo isn't set up on the server yet."}[this.state];
    return m?'<p style="margin:2px 18px 0;font-size:11.5px;opacity:.7">'+m+'</p>':"";
  },
  can(){ return !!(sb&&App.me&&!App.preview&&App.profile&&App.screen==="app"); },
  refresh(){
    const pn=$("#pgNear"); if(!pn||App.screen!=="app"||App.tab!=="chats") return;
    const sig=(App.pgNear||[]).map(x=>x.p.code+":"+x.d).join()+"|"+this.state;
    if(pn._sig===sig) return; pn._sig=sig;
    pn.innerHTML=pgNearHTML(App.pgNear||[]); wirePgNear(pn);
  },
  start(){
    if(this.wid!=null) return;
    if(!navigator.geolocation){ this.state="unsupported"; this.refresh(); return; }
    this.state="nofix";
    this.fine=false;
    const got=(p,fine)=>{ if(fine) this.fine=true; else if(this.fine) return;
      this.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0,speed:p.coords.speed};
      LSset("zm:lastpos",JSON.stringify({lat:this.pos.lat,lng:this.pos.lng}));
      if(this.state==="nofix"||this.state==="denied") this.state="ok";
      this.tick(!this.sent);
    };
    this.wid=navigator.geolocation.watchPosition(p=>got(p,true),e=>{ this.state=e&&e.code===1?"denied":"nofix"; this.refresh(); },
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    navigator.geolocation.getCurrentPosition(p=>got(p,false),()=>{},{enableHighAccuracy:false,maximumAge:300000,timeout:5000});   /* quick coarse fix while GPS warms up */
    this.timer=setInterval(()=>this.tick(false),7000);
  },
  stop(){
    if(this.wid!=null&&navigator.geolocation) navigator.geolocation.clearWatch(this.wid);
    clearInterval(this.timer); this.wid=null; this.timer=null;
    if(this.sent&&sb&&!$("#pgui")) sb.rpc("zm_pandago_stop").then(()=>{},()=>{});
    this.sent=false; this.pos=null; this.state="idle"; App.pgNear=[];
  },
  async tick(force){
    if(!this.pos||this.busy||!this.can()) return;
    if(!force&&Date.now()-this.last<6000) return;
    if(this.pos.acc>150) return;
    this.busy=true; this.last=Date.now();
    try{
      const a=await sb.rpc("zm_pandago_ping",{p_lat:this.pos.lat,p_lng:this.pos.lng,p_speed:this.pos.speed});
      if(a.error) throw a.error;
      this.sent=true; this.state="ok";
      if(this.wid!=null) await pgNearLoad();
    }catch(e){ console.warn("[pandago-loc]",e&&e.message||e);
      if(/function|schema cache|not exist/i.test(String(e&&e.message))) this.state="setup"; }
    this.busy=false; this.refresh();
  },
  /* decides every few seconds whether we should be sharing */
  check(){
    if(!this.can()){ if(this.wid!=null) this.stop(); return; }
    if(document.hidden){
      if(!this.hiddenAt) this.hiddenAt=Date.now();
      if(Date.now()-this.hiddenAt>20000&&this.wid!=null) this.stop();   // app in background for >20 s
      return;
    }
    this.hiddenAt=0;
    if(this.wid==null) this.start();
  },
  init(){
    if(this.inited) return; this.inited=true;
    setInterval(()=>this.check(),4000);
    document.addEventListener("visibilitychange",()=>{ if(document.hidden) this.hiddenAt=Date.now(); else { this.hiddenAt=0; this.check(); this.tick(true); } });
    window.addEventListener("pagehide",()=>{ try{ if(this.sent&&sb) sb.rpc("zm_pandago_stop").then(()=>{},()=>{}); }catch(e){} });
  }
};

}

        <span class="small muted">${p.verified?"Tap to remove your verification":App.verifyState==="review"?"We're checking your selfie in the background":App.verifyState==="failed"?"We couldn't match your selfie. Tap to retry":"Take a selfie to get a Photo verified badge"}</span></span>

        <button class="listopt" id="pwBtn">${I.lock}<span style="flex:1">Change password</span><span class="muted">›</span></button>
        <button class="listopt" id="supBtn"><span style="width:20px;flex:none;display:block">${I.chat}</span><span style="flex:1">Get Support</span>${isMember()?'<span class="muted">›</span>':'<span class="vstate" style="display:inline-flex;align-items:center;gap:5px"><span style="width:13px;height:13px;display:block">'+I.lock+'</span>Members</span>'}</button>

      const b=modal("Remove verification?",`<p class="muted small" style="margin-bottom:14px;line-height:1.6">Your Photo verified badge will disappear from your profile. You can verify again any time with a new selfie.</p>
        <button class="btn danger" id="vRm">Remove verification</button>
        <button class="btn ghost" id="vKeep" style="margin-top:10px">Keep it</button>`);
      $("#vKeep",b).onclick=closeModal;
      $("#vRm",b).onclick=async()=>{ const bt=$("#vRm",b); bt.disabled=true; bt.textContent="Removing…";
        App.profile.verified=false; App.verifyState=""; await Profiles.save(App.profile); closeModal(); toast("Verification removed"); go("app",{tab:"profile"}); };
      return; }
    if(App.verifyState==="review"){ toast("Your verification is in review"); return; } openVerify(); };
  $("#editBtn").onclick=()=>go("edit",{});
  $("#intBtn").onclick=()=>go("interests",{setup:false});
  $("#previewBtn").onclick=()=>openProfileSheet(App.profile,{readonly:true});
  $("#pwBtn").onclick=()=>go("changepw",{});
  $("#outBtn").onclick=()=>{ const b=modal("Log out?",`<p class="muted small" style="margin-bottom:14px">You'll need your email and password to get back in.</p>
    <button class="btn danger" id="okOut">Log out</button><button class="btn ghost" id="noOut" style="margin-top:10px">Stay</button>`);
    $("#okOut",b).onclick=()=>{closeModal();logout()}; $("#noOut",b).onclick=closeModal; };
  $("#helpBtn").onclick=openHelpCenter;
  (()=>{ /* fills from the left up to your %, shifting from yellow (50% and below) to green (100%) */
    const bar=$("#pcBar"), lbl=$("#pcLbl"); if(!bar) return;
    const col=v=>{ const t=Math.max(0,Math.min(1,(v-50)/50)); return `hsl(${46+t*(138-46)} ${96-t*18}% ${56-t*10}%)`; };
    const t0=performance.now(), D=1500;
    const tick=n=>{ const k=Math.min(1,(n-t0)/D), e=1-Math.pow(1-k,3), v=pct*e;
      bar.style.width=v+"%"; bar.style.background=col(v); lbl.textContent=Math.round(v)+"%";
      if(k<1 && document.body.contains(bar)) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); })();
  $("#setBtn").onclick=()=>go("edit",{});
  $("#delBtn").onclick=()=>{
    if(App.preview){ toast("Not available in preview mode"); return; }
    const b=modal("Delete your account?",`<p class="muted small" style="margin-bottom:14px;line-height:1.6">This permanently deletes your profile, photos, likes, matches and chats. Nothing about you stays in the app, and it can't be undone.</p>
      <button class="btn danger" id="okDelAcc">Yes, delete everything</button>
      <button class="btn ghost" id="noDelAcc" style="margin-top:10px">Cancel</button>`);
    $("#noDelAcc",b).onclick=closeModal;
    $("#okDelAcc",b).onclick=async()=>{
      const btn=$("#okDelAcc",b); btn.disabled=true; btn.textContent="Deleting…";
      const r=await Account.deleteMine();
      if(!r.ok){ closeModal(); toast("Couldn't delete: "+r.message,5200); return; }
      closeModal();
      try{ Object.keys(localStorage).filter(k=>k.startsWith("zm:")&&k!=="zm:theme").forEach(k=>localStorage.removeItem(k)); }catch(e){}
      await logout("Your account and all its data have been deleted. Goodbye 💛");
    };
  };
  $("#themeBtn").onclick=()=>{
    const order=["auto","light","dark"]; const cur=LSget("zm:theme")||"auto";
    const next=order[(order.indexOf(cur)+1)%3];
    LSset("zm:theme",next); applyTheme(); $("#themeNow").textContent=next;
  };
}
function applyTheme(){
  const t=LSget("zm:theme")||"auto";
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

<script>
/* ==========================================================================
   ADMIN DASHBOARD  —  #/admin
   Only the owner / an editor of the published page passes DB.isAdmin().
   ========================================================================== */
const AD = { tab:"overview", members:[], profiles:{}, likes:[], matches:[], reports:[], msgs:[] };
const prof=(code,f)=>{ const p=AD.profiles[code]; return p?p[f]:null; };

async function openAdmin(){
  const box=$("#admin"); box.classList.add("on");
  location.hash="#/admin";
  box.innerHTML=`<div class="adwrap"><p class="muted">Checking admin access…</p></div>`;
  const ok=await Members.isAdmin();
  if(!ok){
    box.innerHTML=`<div class="adwrap" style="max-width:480px;padding-top:60px;text-align:center">
      <div style="width:150px;margin:0 auto">${pandaSVG("m")}</div>
      <h1 style="margin-top:14px">Admin only</h1>
      <p class="muted" style="margin-top:10px;line-height:1.6">This dashboard is limited to the owner of ZOOIANS MATCH and anyone given edit access to it.</p>
      <button class="btn ghost" id="adClose" style="margin-top:20px">Back to the app</button></div>`;
    $("#adClose").onclick=closeAdmin; return;
  }
  await adLoad(); adRender();
}
function closeAdmin(){ $("#admin").classList.remove("on"); $("#admin").innerHTML="";
  if(location.hash==="#/admin") history.replaceState(null,"","#"); }

async function adLoad(){
  const d=await Admin.load();
  AD.profiles={}; d.profiles.forEach(p=>AD.profiles[p.code]=p);
  AD.members=d.profiles.map(p=>({code:p.code,status:p.status||"active",notes:"",createdAt:p.createdAt,lastSeen:p.lastSeen}))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  AD.likes=d.likes; AD.matches=d.matches; AD.reports=d.reports; AD.msgs=d.msgs;
  await loadConfig();
}

function adRender(){
  const box=$("#admin");
  const m=AD.members, pr=AD.profiles;
  const complete=m.filter(x=>pr[x.code]&&pr[x.code].done).length;
  const activeChats=new Set(AD.msgs.map(x=>x.pid)).size;
  const stats=[
    ["hl",m.length,"Total members"],
    ["",m.filter(x=>x.status==="active").length,"Active"],
    ["",m.filter(x=>BAD_STATUS.includes(x.status)).length,"Banned / suspended"],
    ["",m.length-complete,"Incomplete profiles"],
    ["",AD.likes.length,"Likes"],
    ["",AD.matches.length,"Matches"],
    ["",activeChats,"Active chats"],
    ["",AD.reports.filter(r=>r.state==="open").length,"Open reports"]
  ];
  box.innerHTML=`<div class="adwrap">
    <div class="adhead">
      <span class="tile" style="background:transparent"><img src="${ICON}" alt=""></span>
      <div style="flex:1">
        <h1 style="font-size:24px">Admin dashboard</h1>
        <p class="small muted">ZOOIANS MATCH ·
          <span class="syncdot ${DB.mode==="cloud"?"":"local"}"><i></i>${DB.mode==="cloud"?"Cloud database":"Local device storage"}</span></p>
      </div>
      <button class="btn ghost sm" id="adRefresh">Refresh</button>
      <button class="btn dark sm" id="adExit">Exit</button>
    </div>
    <div class="stats">${stats.map(([c,n,l])=>`<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
    <div class="tabs">${[["overview","Overview"],["members","Members"],["reports","Reports"],["content","Zoo GC & interests"],["settings","Settings"]]
      .map(([k,l])=>`<button data-at="${k}" class="${AD.tab===k?"on":""}">${l}</button>`).join("")}</div>
    <div id="adBody"></div></div>`;
  $("#adExit").onclick=closeAdmin;
  $("#adRefresh").onclick=async()=>{ await adLoad(); adRender(); toast("Refreshed"); };
  $$("[data-at]").forEach(b=>b.onclick=()=>{ AD.tab=b.dataset.at; adRender(); });
  ({overview:adOverview,members:adMembers,reports:adReports,content:adContent,settings:adSettings}[AD.tab])($("#adBody"));
}

function adOverview(root){
  const recent=AD.members.slice(0,6);
  const topLiked={}; AD.likes.forEach(l=>topLiked[l.to]=(topLiked[l.to]||0)+1);
  const ranked=Object.entries(topLiked).sort((a,b)=>b[1]-a[1]).slice(0,6);
  root.innerHTML=`<div class="adgrid">
    <div class="card"><h3 style="margin-bottom:10px">Newest members</h3>
      ${recent.length?recent.map(x=>`<div class="kv"><b style="min-width:90px">${esc(prof(x.code,"name")||"New member")}</b>
        <span style="flex:1;font-size:12px" class="muted">${esc(x.code.slice(0,13))}…</span>
        <span class="tag ${x.status}">${x.status}</span></div>`).join(""):'<p class="muted small">No members yet. Anyone can sign up from the login screen.</p>'}
    </div>
    <div class="card"><h3 style="margin-bottom:10px">Most liked</h3>
      ${ranked.length?ranked.map(([c,n])=>`<div class="kv"><b>${esc(prof(c,"name")||"Member")}</b><span style="flex:1"></span><span>${n} likes</span></div>`).join("")
        :'<p class="muted small">No likes yet.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:10px">How sign-up works</h3>
      <p class="small muted" style="line-height:1.7">The app is open to everyone. People create an account with email and password (handled by Supabase) and are active straight away. Use the Members tab to disable or suspend anyone who breaks the rules.</p></div>
  </div>`;
}

function adMembers(root){
  root.innerHTML=`<div class="searchwrap" style="padding:0 0 12px">
      <div class="search">${I.search}<input id="adSearch" placeholder="Search id, name or status"></div></div>
    <div class="tablewrap"><table><thead><tr>
      <th>Member id</th><th>Status</th><th>Name</th><th>Age</th><th>Gender</th><th>Location</th>
      <th>Profile</th><th>Joined</th><th>Last active</th><th>Actions</th>
    </tr></thead><tbody id="mRows"></tbody></table></div>`;
  const paint=q=>{
    const rows=AD.members.filter(x=>{ if(!q) return true; const s=q.toLowerCase();
      return x.code.toLowerCase().includes(s)||(prof(x.code,"name")||"").toLowerCase().includes(s)||x.status.includes(s); });
    $("#mRows").innerHTML=rows.map(x=>{
      const p=AD.profiles[x.code]||{};
      const done=p.done?`<span class="tag active">complete</span>`:`<span class="tag pending">incomplete</span>`;
      return `<tr>
        <td><code class="code">${esc(x.code.slice(0,13))}…</code></td>
        <td><span class="tag ${x.status}">${x.status}</span></td>
        <td>${esc(p.name||"—")}</td><td>${p.age||"—"}</td><td>${esc(p.gender||"—")}</td>
        <td>${esc((p.loc&&p.loc.label)||"—")}</td>
        <td>${done}</td><td>${dateOf(x.createdAt)}</td><td>${x.lastSeen?timeAgo(x.lastSeen):"never"}</td>
        <td><div class="rowacts">
          ${x.status!=="active"?`<button class="mini green" data-act="active" data-c="${x.code}">Activate</button>`:""}
          ${x.status==="active"?`<button class="mini red" data-act="banned" data-c="${x.code}">Ban</button><button class="mini" data-act="suspended" data-c="${x.code}">Suspend</button>`:""}
          <button class="mini" data-view="${x.code}">View</button>
          <button class="mini red" data-del="${x.code}">Delete</button>
        </div></td></tr>`;
    }).join("")||`<tr><td colspan="10" style="text-align:center;padding:28px" class="muted">No members match that.</td></tr>`;
    wireRows();
  };
  const wireRows=()=>{
    $$("[data-act]").forEach(b=>b.onclick=async()=>{
      await Members.setStatus(b.dataset.c,b.dataset.act);
      toast("Member is now "+b.dataset.act); await adLoad(); adRender(); });
    $$("[data-del]").forEach(b=>b.onclick=()=>{
      const c=b.dataset.del;
      const m=modal("Delete this member?",`<p class="muted small" style="margin-bottom:14px">Their profile and photos are removed from the app. Their sign-in account stays in Supabase (Authentication → Users) — delete it there too if you want it gone completely.</p>
        <button class="btn danger" id="okDel">Delete profile data</button>
        <button class="btn ghost" id="noDel" style="margin-top:10px">Cancel</button>`);
      $("#noDel",m).onclick=closeModal;
      $("#okDel",m).onclick=async()=>{ await Members.remove(c); closeModal(); toast("Deleted");
        await adLoad(); adRender(); };
    });
    $$("[data-view]").forEach(b=>b.onclick=()=>adViewMember(b.dataset.view));
  };
  paint("");
  $("#adSearch").oninput=e=>paint(e.target.value.trim());
}

function adViewMember(code){
  const m=AD.members.find(x=>x.code===code)||{status:"active"};
  const p=AD.profiles[code]||{};
  const likesGiven=AD.likes.filter(l=>l.from===code).length;
  const likesGot=AD.likes.filter(l=>l.to===code).length;
  const matches=AD.matches.filter(x=>x.members&&x.members.includes(code)).length;
  const body=modal(p.name||"Member",`
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px">
      ${(p.photos||[]).map(ph=>`<img src="${ph}" style="width:72px;height:96px;object-fit:cover;border-radius:12px">`).join("")||'<span class="muted small">No photos uploaded</span>'}</div>
    <div class="card" style="padding:6px 14px;margin-bottom:12px">
      <div class="kv"><b>Member id</b><span><code class="code">${esc(code)}</code></span></div>
      <div class="kv"><b>Status</b><span class="tag ${m.status}">${m.status}</span></div>
      <div class="kv"><b>Name</b><span>${esc(p.name||"—")}</span></div>
      <div class="kv"><b>Age</b><span>${p.age||"—"}</span></div>
      <div class="kv"><b>Gender</b><span>${esc(p.gender||"—")}</span></div>
      <div class="kv"><b>Height</b><span>${p.height?hLabel(p.height):"—"}</span></div>
      <div class="kv"><b>Location</b><span>${esc((p.loc&&p.loc.label)||"—")}</span></div>
      <div class="kv"><b>Professional</b><span>${esc(p.work||"—")}</span></div>
      <div class="kv"><b>Looking for</b><span>${esc(plain(p.looking)||"—")}</span></div>
      <div class="kv"><b>Zoo GC</b><span>${p.gc&&p.gc.member?esc(p.gc.which):"Not in a GC"}</span></div>
      <div class="kv"><b>Languages</b><span>${esc((p.langs||[]).join(", ")||"—")}</span></div>
      <div class="kv"><b>Bio</b><span>${esc(p.bio||"—")}</span></div>
      <div class="kv"><b>Joined</b><span>${dateOf(m.createdAt)}</span></div>
      <div class="kv"><b>Last active</b><span>${m.lastSeen?timeAgo(m.lastSeen):"never"}</span></div>
      <div class="kv"><b>Activity</b><span>${likesGiven} given · ${likesGot} received · ${matches} matches</span></div>
    </div>
    <div class="chips" style="margin-bottom:14px">${(p.interests||[]).map(i=>`<span class="chip" style="pointer-events:none">${esc(i)}</span>`).join("")||'<span class="muted small">No interests</span>'}</div>
    <div class="field"><label>Admin note</label><input class="input" id="vNote" value="${esc(m.notes||"")}"></div>
    <div class="rowacts">
      <button class="mini green" data-s="active">Activate</button>
      <button class="mini red" data-s="banned">Ban</button>
      <button class="mini red" data-s="suspended">Suspend</button>
      <button class="mini" id="vSave">Save note</button>
    </div>`);
  $$("[data-s]",body).forEach(b=>b.onclick=async()=>{ await Members.setStatus(code,b.dataset.s);
    closeModal(); toast("Member → "+b.dataset.s); await adLoad(); adRender(); });
  $("#vSave",body).onclick=async()=>{ const mm=(await Members.get(code))||{code,status:"active",createdAt:now()};
    mm.notes=$("#vNote",body).value; await Members.save(mm); closeModal(); toast("Note saved"); await adLoad(); adRender(); };

async function boot(){
  applyTheme();

  $("#splashPandas").insertAdjacentHTML("beforeend",
    `<div class="p m">${pandaSVG("m")}</div><div class="p f">${pandaSVG("f")}</div>`);

  await DB.init();
  await loadConfig();

  /* keep the UI honest if the session ends elsewhere (other tab, expired token) */
  if(sb) sb.auth.onAuthStateChange(ev=>{
    if(ev==="SIGNED_OUT" && App.me && !App.preview){
      clearInterval(startGuard._t); App.me=null; App.profile=null; Session.clear(); go("login");
    }
  });

  const done=()=>{ const s=$("#splash"); if(!s) return; s.classList.add("out"); setTimeout(()=>s.remove(),700); };

  if(location.hash==="#/admin"){ done(); openAdmin(); ROUTES.login(); return; }

  /* restore the signed-in user after a refresh */
  const s=await Auth.session();
  if(s && s.user){
    if(await Members.isActive(codeOf(s.user))){
      const code=codeOf(s.user);
      App.me=code; App.email=s.user.email||""; App.preview=false;
      await Members.touch(code);
      const p=await Profiles.get(code);
      App.profile=p||blankProfile(code);
      setTimeout(done,700);
      if(!p||!p.done){ App.setupDraft=App.profile; go("setup",{step:0}); }
      else if(needsExtras(p)){ App.setupDraft=App.profile; go("setup",{step:3}); }
      else {
        const r=loadRoute()||{};
        if(r.n==="edit"||r.n==="changepw"){ await go("app",{tab:"profile"}); go(r.n,{}); }
        else if(r.n==="interests"){ await go("app",{tab:"profile"}); go("interests",{setup:false}); }
        else {
          await go("app",{tab:r.n==="app"&&r.tab?r.tab:"people"});
          if(LSget("zm:pgopen")==="1") openPandaGo();      /* refresh while PandaGo was open -> back to PandaGo */
          if(r.n==="app"&&r.chat){ try{ const m=(App.matches||[]).find(x=>x.id===r.chat);
            if(m){ const o=await profileOf(m.members.find(c=>c!==App.me)); if(o) openChat(r.chat,o); } }catch(e){} }
        }
      }
      startGuard(); startRealtime(); return;
    }
    setTimeout(done,500); go("banned");

  }

}

/* live updates: new messages (unread badge + inbox order), new likes, new matches */
function startRealtime(){
  App.watchers.forEach(u=>{try{u()}catch(e){}}); App.watchers=[];
  const me=App.me; if(!me||App.preview) return;
  const onList=()=>App.screen==="app"&&!$("#frame .sheet");
  let syncing=false;

  /* one place that reconciles matches: new match -> popup, unmatched -> chat disappears, new message -> list order */
  async function syncMatches(){
    if(syncing||!App.me) return; syncing=true;
    try{
      const prev=App.matches||[], after=await Social.matches(me);
      const prevIds=new Set(prev.map(m=>m.id)), nowIds=new Set(after.map(m=>m.id));
      const fresh=after.filter(m=>!prevIds.has(m.id)), gone=prev.filter(m=>!nowIds.has(m.id));
      const msgChanged=after.some(m=>{ const o=prev.find(x=>x.id===m.id); return o&&o.lastAt!==m.lastAt; });
      App.matches=after;
      if(gone.length){ App.myLikes=await Social.myLikes(me); App.likedYou=await Social.likedBy(me); }
      paintBadges();
      if(App.openChatPid && !nowIds.has(App.openChatPid)){      /* the other person unmatched you while this chat was open */
        if(threadUnsub){ try{threadUnsub()}catch(e){} threadUnsub=null; }
        $$("#frame .sheet").forEach(x=>x.remove()); App.openChatPid=null;
        go("app",{tab:"chats"}); return;
      }
      const fm=fresh.filter(m=>!m.pg);          /* PandaGo chats start as a message, not a "match" */
      if(fm.length){ const other=await profileOf(fm[0].members.find(c=>c!==me)); showMatch(other); }
      if(onList()){
        if(App.tab==="chats" && (fresh.length||gone.length||msgChanged)) go("app",{tab:"chats"});
        else if(App.tab==="liked" && (fresh.length||gone.length)) go("app",{tab:"liked"});
        else if(App.tab==="people" && gone.length) go("app",{tab:"people"});   /* they're back in discovery */
      }
    }finally{ syncing=false; }
  }

  App.watchers.push(Chat.watchInbox(m=>{
    const mt=App.matches.find(x=>x.id===m.pid||(x.alias&&x.alias.includes(m.pid))||(m.from&&m.to&&x.members.includes(m.from)&&x.members.includes(m.to)));
    if(!mt){ syncMatches(); return; }
    mt.lastMsg=m.text; mt.lastAt=m.at; mt.lastFrom=m.from; paintBadges();
    if(m.from!==me) buzz(20);
    if(App.tab==="chats"&&onList()) go("app",{tab:"chats"});
  }));
  App.watchers.push(Social.watch(me,{
    onLike:async()=>{ App.likedYou=await Social.likedBy(me); paintBadges();
      if(App.tab==="liked"&&onList()) go("app",{tab:"liked"}); },
    onMatch:syncMatches, onGone:syncMatches
  }));
  /* safety net: also reconcile every 6 s (covers a dropped websocket) */
  const t=setInterval(()=>{ if(!document.hidden) syncMatches(); },6000);
  App.watchers.push(()=>clearInterval(t));
}

/* a disabled member loses access within a minute, even mid-session */
function startGuard(){
  clearInterval(startGuard._t);
  const check=async()=>{
    if(!App.me || App.preview) return;
    if(!(await Members.isActive(App.me))){
      clearInterval(startGuard._t);
      App.watchers.forEach(u=>{try{u()}catch(e){}}); App.watchers=[];
      closeModal(); $$("#frame .sheet").forEach(x=>x.remove()); $("#matchui").classList.remove("on"); $("#callui").classList.remove("on");
      Session.clear(); App.me=null; App.profile=null; profileCache.clear();
      go("banned");
    } else { Members.touch(App.me); }
  };
  startGuard._t=setInterval(check,20000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
}

/* a living network across the whole PandaGo screen: drifting nodes that link up when they get close */
function pgMesh(ui){
  const net=$(".pg-net",ui); if(!net) return;
  const cv=document.createElement("canvas"); cv.className="pg-mesh"; net.prepend(cv);
  const ctx=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0,nodes=[],link=130;
  const size=()=>{ W=ui.clientWidth||360; H=ui.clientHeight||700; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
    link=Math.max(110,Math.min(160,W*.36));
    const n=Math.round(Math.min(52,Math.max(26,W*H/13000)));
    nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45,ph:Math.random()*6.28})); };
  size();
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame=t=>{
    if(!document.body.contains(cv)) return;
    ctx.clearRect(0,0,W,H);
    for(const a of nodes){ a.x+=a.vx; a.y+=a.vy; if(a.x<0||a.x>W) a.vx*=-1; if(a.y<0||a.y>H) a.vy*=-1; }
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<link){ ctx.strokeStyle=`rgba(242,165,12,${((1-d/link)*.42).toFixed(3)})`; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
    for(const a of nodes){ const k=.5+.5*Math.sin(t/650+a.ph); ctx.fillStyle=`rgba(242,165,12,${(.35+.5*k).toFixed(3)})`; ctx.beginPath(); ctx.arc(a.x,a.y,2+1.6*k,0,6.2832); ctx.fill(); }
    if(!reduce) requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
}

      const a=base+i*(2*Math.PI/Math.max(list.length,1))+(i%2?.35:0);
      const r=70+Math.min(it.d,PG_RADIUS)/PG_RADIUS*62;
      const b=bubble(it); b.style.left=`calc(50% + ${Math.round(Math.cos(a)*r)}px)`; b.style.top=`calc(50% + ${Math.round(Math.sin(a)*r)}px)`;
      room.appendChild(b);
    });
    const n=list.length;
    $("#pgRoomText",ui).textContent="Scanning for people";
    $("#pgFoot",ui).textContent=n?`${n} nearby · You're visible only to people within ${PG_RADIUS} m while the app is open.`:`You're visible only to people within ${PG_RADIUS} m while the app is open.`;
  };

  /* ---- server: publish my spot, read who's close ---- */
  let lastPing=0, busy=false;
  const sync=async(force)=>{
    if(st.closed||!sb||!st.pos||busy) return; if(!force&&Date.now()-lastPing<7000) return;
    if(st.pos.acc>150) return;
    busy=true; lastPing=Date.now();
    try{
      const a=await sb.rpc("zm_pandago_ping",{p_lat:st.pos.lat,p_lng:st.pos.lng,p_speed:st.speed});
      if(a.error) throw a.error;
      const {data,error}=await sb.rpc("zm_pandago_nearby"); if(error) throw error;
      st.srv=true;
      const blocked=new Set(App.blocks.map(b=>b.from===App.me?b.to:b.from)), out=[];
      for(const r of (data||[])){ if(blocked.has(r.user_id)) continue;
        const p=await profileOf(r.user_id); if(p&&p.done&&p.gender===want) out.push({p,d:r.dist_m}); }
      st.real=out; App.pgNear=out.slice(); paintNear();
    }catch(e){ console.warn("[pandago]",e&&e.message||e); if(/function|schema cache|not exist/i.test(String(e&&e.message))) st.srv=false; }
    busy=false;
    paintLive();

    if(refreshQueued&&!st.closed){
            refreshQueued=false;
      sync(true);
    }else{
      pgIndicator.classList.remove("show","refreshing");
    }
  };
/* ---- PandaGo pull-to-refresh ---- */
let refreshQueued=false;
let pgPullStartY=null;
let pgPullDistance=0;

const pgIndicator=$("#pgPullIndicator",ui);

const refreshPeople=()=>{
  if(st.closed) return;

  lastPing=0;
  pgIndicator.classList.add("show","refreshing");
    setTimeout(()=>pgIndicator.classList.remove("show","refreshing"),4000);

  if(busy){
    refreshQueued=true;
    return;
  }

  sync(true);
};

$("#pgRefresh",ui).addEventListener("click",refreshPeople);

ui.addEventListener("touchstart",e=>{
  if(e.touches.length!==1) return;

  const y=e.touches[0].clientY;
  const rect=ui.getBoundingClientRect();

  if(y-rect.top>120) return;

  pgPullStartY=y;
  pgPullDistance=0;
},{passive:true});

ui.addEventListener("touchmove",e=>{
  if(pgPullStartY===null) return;

  pgPullDistance=Math.max(
    0,
    e.touches[0].clientY-pgPullStartY
  );

  if(pgPullDistance>10){
    pgIndicator.classList.add("show");
    pgIndicator.classList.remove("refreshing");
  }
},{passive:true});

ui.addEventListener("touchend",e=>{
  if(pgPullStartY===null) return;

  const distance=e.changedTouches[0].clientY-pgPullStartY;

  pgPullStartY=null;
  pgPullDistance=0;

  if(distance>75){
    refreshPeople();
  }else{
    pgIndicator.classList.remove("show","refreshing");
  }
},{passive:true});

ui.addEventListener("touchcancel",()=>{
  pgPullStartY=null;
  pgPullDistance=0;
  pgIndicator.classList.remove("show","refreshing");
},{passive:true});
  /* ---- the map: always on, always centred on you ---- */
  const OSM="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
  const start=()=>st.pos||PGLoc.pos||lp||{lat:23.8103,lng:90.4125};
  const initMap=async()=>{
    try{ await loadLeaflet(); }catch(e){ const m=$("#pgMap",ui); if(m) m.innerHTML='<p class="pg-nomap">Map couldn\'t load — check your connection.</p>'; return; }
    if(st.map||st.closed||!$("#pgMap",ui)) return;
    const c=start(), L=window.L; st.zoom=18;
    st.map=L.map("pgMap",{zoomControl:false,attributionControl:true,zoomSnap:.5,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,keyboard:false}).setView([c.lat,c.lng],18);
    L.tileLayer(OSM,{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(st.map);
    st.trail=L.polyline([],{color:"#FFB300",weight:6,opacity:.85,lineCap:"round"}).addTo(st.map);
    const myPhoto=(App.profile&&App.profile.photos&&App.profile.photos[0])||artFor(App.me,App.profile&&App.profile.name);
const croppedPhoto=await faceCrop(myPhoto).catch(()=>null);
const markerPhoto=croppedPhoto||myPhoto;

st.mk=L.marker([c.lat,c.lng],{
  icon:L.divIcon({
    className:"pgmk",
    html:`<div class="pgcar"><img class="pg-avatar-marker" src="${markerPhoto}" alt="My profile"></div>`,
    iconSize:[64,64],
    iconAnchor:[32,32]
  }),
  interactive:false,
  zIndexOffset:1000
}).addTo(st.map);
    setTimeout(()=>st.map&&st.map.invalidateSize(),60);
    setTimeout(()=>st.map&&st.map.invalidateSize(),2000);   /* after the pop-in animation settles */
  };
  const follow=()=>{
    if(!st.map||!st.pos) return; const ll=[st.pos.lat,st.pos.lng], z=st.moving?17:18;
    st.mk.setLatLng(ll);
    const car=st.mk.getElement();
    if(st.moving){ st.trail.addLatLng(ll); const tr=st.trail.getLatLngs(); if(tr.length>60) st.trail.setLatLngs(tr.slice(-60)); }
    else if(st.trail.getLatLngs().length) st.trail.setLatLngs([]);
    if(st.zoom!==z){ st.zoom=z; st.map.setView(ll,z,{animate:true,duration:.8}); }
    else st.map.panTo(ll,{animate:true,duration:.9,easeLinearity:1,noMoveStart:true});
  };

  /* ---- GPS: standing still = one spot; running/driving = the map moves the way you go ---- */
  let wid=null, firstFix=true;
  const onPos=p=>{
    const c=p.coords, t=p.timestamp||Date.now(); st.geo="ok";
    let sp=(c.speed!=null&&isFinite(c.speed))?c.speed:null;
    if(sp===null&&st.last){ const dt=(t-st.last.t)/1000, d=geoM(st.last.lat,st.last.lng,c.latitude,c.longitude);
      if(dt>=1&&dt<30&&d>Math.max(6,(c.accuracy||0)*.7)) sp=d/dt; else sp=0; }
    if(st.last){ const dE=(c.longitude-st.last.lng)*Math.cos(c.latitude*Math.PI/180);
      if(Math.abs(dE)>1e-6) st.flip=dE>0; }                       /* the car faces left by default; flip when heading right */
    st.last={lat:c.latitude,lng:c.longitude,t}; st.pos={lat:c.latitude,lng:c.longitude,acc:c.accuracy||0,t};
    LSset("zm:lastpos",JSON.stringify({lat:c.latitude,lng:c.longitude}));
    st.speed=st.speed*.55+(sp||0)*.45;
    if(st.speed>1.8){ st.fast++; st.slow=0; } else if(st.speed<.9){ st.slow++; st.fast=0; }
    if(st.fast>=2) st.moving=true; if(st.slow>=4) st.moving=false;
    const hud=$("#pgHud",ui); if(hud){ hud.classList.toggle("hide",!st.moving); $("#pgSpd",ui).textContent=Math.round(st.speed*3.6); }
    if(firstFix&&st.map){ firstFix=false; st.map.setView([c.latitude,c.longitude],18,{animate:false}); st.zoom=18; }
    follow(); paintLive(); sync();
  };
  initMap().then(()=>{ if(st.pos) follow(); });
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>{ if(!st.closed&&!st.fine) onPos(p); },()=>{},{enableHighAccuracy:false,maximumAge:300000,timeout:4000});   /* fast rough fix first */
    wid=navigator.geolocation.watchPosition(p=>{ st.fine=true; onPos(p); },e=>{ st.geo=e&&e.code===1?"denied":"err"; paintLive();
      if(e&&e.code===1) $("#pgRoomText",ui).textContent="Allow location to find people within 30 m."; },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  } else { st.geo="denied"; paintLive(); }
  T(()=>sync(),7000);
  paintLive();
  if(st.pos){ paintNear(); sync(true); }

  /* ---- a nearby person's PandaGo card (not the swipe card) ---- */
  function pgCard(it){
    const p=it.p, mine=me.interests||[], com=commonInterests(p.interests||[],mine).slice(0,3);
    const ph=(p.photos&&p.photos[0])||"";
    const box=el("div","pgcard");
    box.innerHTML=`<div class="bk"></div><div class="sh">
      <button class="x" aria-label="Close">✕</button>
      <div class="pgface"><i></i><i></i><img data-face="${ph}" src="${ph||artFor(p.code,p.name)}" alt=""></div>
      <h3>${esc(p.name)}${p.age?`, ${p.age}`:""}</h3>
      <p class="dd">${it.d} m away${p.verified?" · Photo verified":""}${p.work?" · "+esc(plain(p.work)):""}</p>
      ${com.length?`<div class="cm">${com.map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:""}
      ${p.bio?`<p class="bio">${esc(p.bio.length>110?p.bio.slice(0,108)+"…":p.bio)}</p>`:""}
      <div class="qk">${["👋 Hi!","Hey, you're nearby 🐼","Coffee?"].map(t=>`<button>${t}</button>`).join("")}</div>
      <div class="snd"><input id="pgMsg" maxlength="200" placeholder="Say hi to ${esc(p.name)}…" autocomplete="off"><button id="pgSend" aria-label="Send">${I.send}</button></div>
      <button class="linkbtn" id="pgProf" style="margin-top:10px;font-size:13px">View full profile</button>
      <button class="linkbtn" id="pgBlk" style="margin-top:2px;font-size:13px;color:var(--pink)">Block</button>
      <p class="hint">Messages from PandaGo go to Chats → PandaGo.</p></div>`;
    ui.appendChild(box);
    requestAnimationFrame(()=>box.classList.add("on"));
    const close=()=>{ box.classList.remove("on"); setTimeout(()=>box.remove(),260); };
    $(".bk",box).onclick=close; $(".x",box).onclick=close;
    $$(".qk button",box).forEach(b=>b.onclick=()=>{ $("#pgMsg",box).value=b.textContent; $("#pgMsg",box).focus(); });
    $("#pgProf",box).onclick=()=>openProfileSheet(p,{readonly:true});
    $("#pgBlk",box).onclick=()=>{ if(it.test){ toast("Test person"); return; } pgBlockDialog(p,()=>{ st.real=st.real.filter(x=>x.p.code!==p.code); paintNear(); close(); }); };
    const send=async()=>{
      const t=$("#pgMsg",box).value.trim(); if(!t) return;
      if(it.test){ toast("Test person — message not sent",2600); return; }
      const btn=$("#pgSend",box); btn.disabled=true;
      try{
        const r=await sb.rpc("zm_pandago_start",{other:p.code});
        if(r.error) throw r.error;
        const mid=r.data, res=await Chat.send(mid,App.me,t,p.code);
        if(res.error) throw res.error;
        App.matches=await Social.matches(App.me); paintBadges();
        close(); toast("Sent ✓ — find it in Chats → PandaGo",3200);
      }catch(e){ btn.disabled=false; const m=String(e&&e.message||e);
        toast(/pandago_wait/.test(m)?"Wait for their reply — you can message again once they answer":/not_nearby/.test(m)?"They moved out of range":/blocked/.test(m)?"You can't message this person":/function/i.test(m)?"PandaGo isn't set up yet (run zm-pandago.sql)":"Couldn't send: "+m,3600); }
    };
    $("#pgSend",box).onclick=send;
    $("#pgMsg",box).addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  }

  const close=()=>{ st.closed=true; st.ids.forEach(clearInterval);
    if(wid!=null&&navigator.geolocation) navigator.geolocation.clearWatch(wid);
    try{ if(st.map) st.map.remove(); }catch(e){}
    LSset("zm:pgopen","");
    ui.remove(); };
  $("#pgBack",ui).onclick=close;
}

PGLoc.init();
boot();
</script>
